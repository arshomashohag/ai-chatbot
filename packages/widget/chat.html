<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat</title>
    <style>
      body { margin: 0; font: 14px system-ui; background: #fff; color: #111; }
      #root { display: flex; flex-direction: column; height: 100vh; }
      #header { padding: 16px; font-weight: 600; border-bottom: 1px solid #eee; }
      #status { padding: 12px 16px; color: #444; }
      #root[data-state="unavailable"] #status { color: #a00; }
      #log { flex: 1; overflow-y: auto; padding: 8px 16px; }
      .msg { margin: 8px 0; max-width: 80%; padding: 8px 12px; border-radius: 10px; }
      .msg.user { margin-left: auto; background: #eef; }
      .msg.bot { background: #f3f3f3; }
      #composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #eee; }
      #input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 8px; }
      #send { padding: 8px 14px; border: none; border-radius: 8px; background: #111; color: #fff; cursor: pointer; }
      #send:disabled { opacity: .5; cursor: default; }
      #root[data-state="unavailable"] #composer { display: none; }
    </style>
  </head>
  <body>
    <div id="root" data-state="loading">
      <div id="header">Chat</div>
      <div id="status">Connecting…</div>
      <div id="log"></div>
      <form id="composer">
        <input id="input" autocomplete="off" placeholder="Type a message…" />
        <button id="send" type="submit">Send</button>
      </form>
    </div>
    <script type="module" src="/src/chat/main.ts"></script>
  </body>
</html>
