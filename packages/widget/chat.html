<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <style>
      :root {
        --wa: #6d5ae6;
        --ink: #14131a;
        --line: rgba(20, 19, 26, 0.09);
        --muted: #6f6c7d;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      #root {
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: #fff;
      }

      /* Header — gradient from the tenant accent */
      #headbar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 12px 14px 16px;
        min-height: 70px;
        color: #fff;
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--wa) 82%, #fff) 0%,
          var(--wa) 55%,
          color-mix(in srgb, var(--wa) 78%, #14131a) 100%
        );
      }
      #avatar {
        width: 38px;
        height: 38px;
        flex: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.55);
        display: grid;
        place-items: center;
      }
      #header {
        font-weight: 600;
        font-size: 16px;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      #headmeta {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-top: 3px;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #headmeta .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #fff;
        display: block;
      }
      #close {
        flex: none;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
        cursor: pointer;
        transition: background 0.12s ease;
      }
      #close:hover {
        background: rgba(255, 255, 255, 0.28);
      }
      #close:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .retry {
        margin-top: 10px;
        padding: 8px 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--wa);
        cursor: pointer;
      }
      .retry:hover {
        background: #f5f4fa;
      }

      /* Message log */
      #log {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 18px 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        background: radial-gradient(
          120% 60% at 0% 0%,
          color-mix(in srgb, var(--wa) 7%, #fff) 0%,
          #f8f7fc 60%
        );
      }
      #status {
        font-size: 12px;
        color: var(--muted);
        padding-left: 2px;
      }
      #root[data-state="unavailable"] #status {
        color: var(--color-danger, #c0442c);
      }
      #root[data-state="unavailable"] #composer {
        display: none;
      }

      .msg {
        max-width: 88%;
        padding: 12px 15px;
        font-size: 14px;
        line-height: 1.55;
        overflow-wrap: anywhere;
        word-break: break-word;
        animation: wrise 0.28s ease-out;
      }
      .msg a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .msg.bot a {
        color: var(--wa);
      }
      .msg.bot {
        align-self: flex-start;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 20px 20px 20px 6px;
        box-shadow: 0 3px 12px -4px rgba(20, 19, 26, 0.12);
      }
      .msg.user {
        align-self: flex-end;
        color: #fff;
        border-radius: 20px 20px 6px 20px;
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--wa) 88%, #fff),
          var(--wa)
        );
        box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--wa) 80%, transparent);
      }
      .typing {
        align-self: flex-start;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 20px 20px 20px 6px;
        box-shadow: 0 3px 12px -4px rgba(20, 19, 26, 0.12);
        padding: 14px 17px;
        display: flex;
        gap: 6px;
      }
      .typing span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--wa);
        animation: wdot 1.2s infinite;
      }
      .typing span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typing span:nth-child(3) {
        animation-delay: 0.3s;
      }

      /* Suggested question pills (greeting state) */
      #suggested {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      #suggested .label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        padding-left: 2px;
      }
      .suggest {
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        text-align: left;
        padding: 10px 16px;
        border-radius: 999px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        background: #fff;
        border: 1px solid var(--line);
        box-shadow: 0 2px 8px -3px rgba(20, 19, 26, 0.14);
        color: var(--ink);
        cursor: pointer;
        transition:
          transform 0.12s ease,
          color 0.12s ease,
          border-color 0.12s ease;
      }
      .suggest:hover {
        border-color: var(--wa);
        color: var(--wa);
        transform: translateY(-1px);
      }
      .suggest span {
        color: var(--wa);
      }

      /* Composer */
      #composer {
        flex: none;
        background: #fff;
        padding: 12px 12px 10px;
        box-shadow: 0 -1px 0 var(--line);
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      #composer .row {
        display: flex;
        gap: 9px;
        align-items: center;
      }
      #input {
        flex: 1;
        min-height: 44px;
        padding: 10px 16px;
        border-radius: 999px;
        background: #f5f4fa;
        border: 1px solid var(--line);
        font: inherit;
        font-size: 14px;
        color: var(--ink);
      }
      #input::placeholder {
        color: var(--muted);
      }
      #input:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--wa) 40%, transparent);
        outline-offset: 1px;
        border-color: var(--wa);
      }
      #send {
        width: 44px;
        height: 44px;
        flex: none;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--wa) 85%, #fff),
          var(--wa)
        );
        border: 0;
        color: #fff;
        box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--wa) 85%, transparent);
        cursor: pointer;
        transition: filter 0.12s ease;
      }
      #send:hover {
        filter: brightness(1.08);
      }
      #send:disabled {
        opacity: 0.5;
        cursor: default;
        filter: none;
      }
      #poweredby {
        text-align: center;
        font-size: 10.5px;
        color: #8e8b9c;
      }
      #poweredby b {
        font-weight: 600;
        color: var(--wa);
      }

      @keyframes wrise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes wdot {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.3;
        }
        30% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root" data-state="loading">
      <div id="headbar">
        <div id="avatar">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="4" y="8" width="16" height="12" rx="4"></rect>
            <path d="M12 4.5v3.5M9.5 14h.01M14.5 14h.01M2.5 13h1.5M20 13h1.5"></path>
          </svg>
        </div>
        <div style="margin-right: auto; min-width: 0">
          <div id="header">Chat</div>
          <div id="headmeta"><span class="dot"></span>AI assistant</div>
        </div>
        <button id="close" type="button" aria-label="Close chat">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <div id="log" role="log" aria-live="polite" aria-relevant="additions">
        <div id="status">Connecting…</div>
      </div>

      <form id="composer">
        <div class="row">
          <input
            id="input"
            autocomplete="off"
            placeholder="Ask a question…"
          />
          <button id="send" type="submit" aria-label="Send">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 12h15M13 6l6 6-6 6"></path>
            </svg>
          </button>
        </div>
        <div id="poweredby">Powered by <b>AI Chatbot</b></div>
      </form>
    </div>
    <script type="module" src="/src/chat/main.ts"></script>
  </body>
</html>
