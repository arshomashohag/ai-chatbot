<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portal — Chatbot Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <style>
      :root {
        --color-bg: #f6f5fa;
        --color-surface: #fff;
        --color-text: #14131a;
        --color-accent: #6d5ae6;
        --color-accent-100: #f4f1fe;
        --color-accent-700: #4f3ec0;
        --color-divider: rgba(20, 19, 26, 0.09);
        --color-neutral-100: #fafafc;
        --color-neutral-200: #f2f1f7;
        --color-neutral-400: #d5d2e1;
        --color-neutral-600: #8e8a9e;
        --color-neutral-700: #6f6c7d;
        --color-danger: #c0442c;
        --color-ok: #0b5f5c;
        --font-heading: "Plus Jakarta Sans", system-ui, sans-serif;
        --font-display: "Instrument Serif", Georgia, serif;
        --shadow-sm: 0 2px 8px -3px rgba(20, 19, 26, 0.12);
        --shadow-md: 0 10px 28px -12px rgba(20, 19, 26, 0.2);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        background: var(--color-bg);
        color: var(--color-text);
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 28px 22px 64px;
      }
      h1 {
        font-family: var(--font-heading);
        font-weight: 800;
        font-size: 30px;
        letter-spacing: -0.03em;
        margin: 6px 0 4px;
      }
      h2 {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 18px;
        letter-spacing: -0.02em;
        margin: 0 0 14px;
      }
      h3 {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 16px;
        margin: 18px 0 8px;
      }
      p {
        margin: 0 0 10px;
      }

      section {
        background: var(--color-surface);
        border: 1px solid var(--color-divider);
        border-radius: 20px;
        padding: 22px;
        margin: 16px 0;
        box-shadow: var(--shadow-sm);
      }

      label {
        display: block;
        margin: 12px 0 6px;
        font-weight: 500;
        font-size: 12px;
        color: var(--color-neutral-700);
      }
      input,
      textarea,
      select {
        width: 100%;
        min-height: 44px;
        padding: 11px 15px;
        border: 1px solid var(--color-divider);
        border-radius: 14px;
        font: inherit;
        font-size: 14px;
        color: var(--color-text);
        background: #fff;
        box-shadow: var(--shadow-sm);
      }
      textarea {
        min-height: 90px;
        resize: vertical;
        line-height: 1.55;
      }
      input:hover,
      textarea:hover,
      select:hover {
        border-color: var(--color-neutral-400);
      }
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 3px solid #e7e2fc;
        outline-offset: 0;
        border-color: #b3a5f1;
      }

      button {
        margin-top: 14px;
        padding: 10px 20px;
        border: 1px solid transparent;
        border-radius: 999px;
        font-family: inherit;
        font-weight: 600;
        font-size: 14px;
        color: #fff;
        background: linear-gradient(135deg, #8271ec, #6d5ae6);
        box-shadow: 0 8px 20px -8px rgba(109, 90, 230, 0.7);
        cursor: pointer;
        transition:
          transform 0.12s ease,
          filter 0.12s ease,
          background 0.12s ease;
      }
      button:hover {
        filter: brightness(1.06);
        transform: translateY(-1px);
      }
      button.secondary {
        background: #fff;
        color: var(--color-text);
        border-color: var(--color-divider);
        box-shadow: var(--shadow-sm);
      }
      button.secondary:hover {
        background: var(--color-neutral-100);
        filter: none;
      }

      .err {
        color: var(--color-danger);
        font-size: 13px;
        margin-top: 8px;
      }
      .ok {
        color: var(--color-ok);
        font-size: 13px;
      }
      pre {
        background: var(--color-neutral-200);
        padding: 14px;
        border-radius: 14px;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 13px;
        border: 1px solid var(--color-divider);
      }
      .kb-item,
      .sess-item {
        border-top: 1px solid var(--color-divider);
        padding: 12px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .kb-item button,
      .sess-item button {
        margin-top: 0;
      }
      .sess-item button {
        width: 100%;
        text-align: left;
        justify-content: flex-start;
      }
      .msg {
        margin: 6px 0;
        padding: 9px 13px;
        border-radius: 14px;
        font-size: 14px;
        max-width: 90%;
      }
      .msg.user {
        margin-left: auto;
        color: #fff;
        background: linear-gradient(135deg, #8271ec, #6d5ae6);
        border-radius: 14px 14px 4px 14px;
      }
      .msg.assistant {
        background: var(--color-neutral-200);
        border-radius: 14px 14px 14px 4px;
      }
      a {
        color: var(--color-accent);
        font-weight: 500;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
