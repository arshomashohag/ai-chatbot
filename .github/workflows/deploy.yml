name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
    secrets:
      AWS_DEPLOY_ROLE:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    concurrency:
      group: deploy-${{ inputs.env }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build widget
        run: pnpm --filter @platform/widget build

      - name: Widget size budget
        run: pnpm widget:size

      # Debug: print the exact claims AWS matches the role trust policy against.
      # Compare `sub` / `aud` here to the trust policy in
      # infra/bootstrap/github-deploy-role.yaml. No secrets are printed.
      - name: Debug OIDC token claims
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE }}
        run: |
          echo "role-to-assume: ${ROLE_ARN}"
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Could not fetch an OIDC token — is 'id-token: write' granted?"
            exit 1
          fi
          # Decode the JWT payload (2nd segment). jq's @base64d needs padding,
          # so pad the base64url payload to a multiple of 4 first.
          payload=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#payload} % 4 )) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          echo "OIDC claims presented to AWS:"
          echo "$payload" | base64 -d | jq '{iss, aud, sub, repository, repository_owner, ref, environment, workflow, job_workflow_ref}'
          echo "AWS matches: aud == \"sts.amazonaws.com\" and sub against the trust policy StringLike."

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1

      - name: CDK deploy
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          ENV: ${{ inputs.env }}
          AWS_REGION: us-east-1
          APP_VERSION: ${{ github.sha }}
        run: pnpm --filter @platform/infra run deploy

      # Build the frontends AFTER deploy, reading every origin and id straight
      # from the deployed stack outputs — nothing about the URL scheme, env, or
      # domain is re-derived here, so the pipeline stays env-independent.
      - name: Build frontends from stack outputs
        env:
          ENV: ${{ inputs.env }}
        run: |
          api="ChatbotPlatform-${ENV}-Api"
          edge="ChatbotPlatform-${ENV}-Edge"
          out() { aws cloudformation describe-stacks --stack-name "$1" \
            --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" --output text; }

          API_ORIGIN="$(out "$api" ApiOrigin)"
          CDN_ORIGIN="$(out "$edge" CdnOrigin)"
          CHAT_ORIGIN="$(out "$edge" ChatOrigin)"
          PORTAL_ORIGIN="$(out "$edge" PortalOrigin)"
          USER_POOL_ID="$(out "$api" UserPoolId)"
          USER_POOL_CLIENT_ID="$(out "$api" UserPoolClientId)"

          VITE_CDN_ORIGIN="$CDN_ORIGIN" \
          VITE_CHAT_ORIGIN="$CHAT_ORIGIN" \
          VITE_API_BASE="$API_ORIGIN" \
          VITE_PORTAL_URL="$PORTAL_ORIGIN" \
          VITE_DEMO_SITE_KEY="${{ vars.DEMO_SITE_KEY }}" \
            pnpm --filter @platform/marketing build

          VITE_API_BASE="$API_ORIGIN" \
          VITE_USER_POOL_ID="$USER_POOL_ID" \
          VITE_USER_POOL_CLIENT_ID="$USER_POOL_CLIENT_ID" \
            pnpm --filter @platform/dashboard build

      - name: Sync static assets and invalidate CloudFront
        env:
          ENV: ${{ inputs.env }}
        run: |
          stack="ChatbotPlatform-${ENV}-Edge"
          get() { aws cloudformation describe-stacks --stack-name "$stack" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }

          aws s3 sync packages/widget/dist      "s3://$(get WidgetBucketName)"    --delete
          aws s3 sync packages/widget/dist-chat "s3://$(get ChatBucketName)"      --delete
          aws s3 sync packages/marketing/dist   "s3://$(get MarketingBucketName)" --delete
          aws s3 sync packages/dashboard/dist   "s3://$(get PortalBucketName)"    --delete

          # Invalidate each distribution so CloudFront serves the freshly synced
          # assets immediately instead of cached copies. Distribution ids come
          # from the Edge stack outputs — nothing hardcoded.
          for out in CdnDistributionId ChatDistributionId \
                     MarketingDistributionId PortalDistributionId; do
            dist="$(get "$out")"
            echo "Invalidating $out → $dist"
            aws cloudfront create-invalidation \
              --distribution-id "$dist" --paths '/*' >/dev/null
          done
